name: Curbside
options:
  bundleIdPrefix: com.Xomware
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: A3HMLDS2AL
    CODE_SIGN_STYLE: Automatic

targets:
  Curbside:
    type: application
    platform: iOS
    sources:
      - path: Curbside
        excludes: ["**/.gitkeep"]
    # Two entitlements files because aps-environment differs by config: development tokens only work on the APNs
    # sandbox. Both carry applinks:curbside.xomware.com for invite and friend links; keep them in step.
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Curbside/Resources/Curbside.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.Xomware.Curbside
        # XcodeGen defaults iOS apps to "1,2"; iPad would make App Store require every orientation.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Curbside/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Curbside
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Curbside uses Face ID to keep your notes about the street locked."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Curbside listens while the stop sign says STOP, and turns what you say into text on this iPhone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Curbside turns what you say into text on this iPhone. Your voice never leaves it."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Curbside uses your location to center the map on your street and to show which houses you're walking past."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURBSIDE_API_HOST: api.curbside.xomware.com
        CURBSIDE_COGNITO_DOMAIN: xomware-curbside.auth.us-east-1.amazoncognito.com
        CURBSIDE_COGNITO_CLIENT_ID: 5e36kviu5jas2sip0aj7mat0ga
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Curbside/Resources/Curbside-Debug.entitlements
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*/Demo/*"

  CurbsideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CurbsideTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Xomware.CurbsideTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Curbside

  CurbsideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CurbsideUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Xomware.CurbsideUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Curbside
    dependencies:
      - target: Curbside

schemes:
  Curbside:
    build:
      targets:
        Curbside: all
        CurbsideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CurbsideTests
    archive:
      config: Release
  # Not in CI: walks every screen in demo mode and writes light and dark PNGs to $TEST_RUNNER_SCREENSHOT_DIR.
  Screenshots:
    build:
      targets:
        Curbside: all
        CurbsideUITests: [test]
    test:
      config: Debug
      targets:
        - CurbsideUITests
